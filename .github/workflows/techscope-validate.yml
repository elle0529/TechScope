name: TechScope Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        run: |
          python --version
      - name: Architecture lint
        run: |
          python tools/architecture_lint.py
      - name: Compile core automation
        run: |
          python -m py_compile tools/architecture_lint.py tools/techscope.py tools/cloud_readiness.py tools/render_runtime_config.py
