name: TechScope Cloud Readiness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure OIDC login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read-only Azure capability probe
        run: |
          az account show --query '{subscription:id,tenant:tenantId,name:name}' -o json
          az provider show --namespace Microsoft.Resources --query registrationState -o tsv
